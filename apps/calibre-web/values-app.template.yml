image:
  tag: "0.6.26"

env:
  PUID: "1003"
  PGID: "1003"
  DOCKER_MODS: "linuxserver/mods:universal-calibre"

ingress:
  main:
    enabled: true
    className: "traefik"
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      traefik.ingress.kubernetes.io/router.middlewares: "infra-cs-bouncer@kubernetescrd,internal-only@kubernetescrd"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: ${CALIBRE_DOMAIN}
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: calibre-web-tls
        hosts:
          - ${CALIBRE_DOMAIN}

affinity: 
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: homelab.lan/nfs-node
              operator: In
              values:
                - "true"

persistence:
  books:
    enabled: true
    existingClaim: "books-pvc"
  config:
    enabled: true
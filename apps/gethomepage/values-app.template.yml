replicaCount: 1

image:
  tag: "v1.7.0"

config:
  allowedHosts:
    - "${HOMEPAGE_DOMAIN}"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "infra-internal-only@kubernetescrd"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "${HOMEPAGE_DOMAIN}"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - "${HOMEPAGE_DOMAIN}"
      secretName: gethomepage-cert

volumes:
- name: homepage-config
  configMap:
    name: gethomepage-config

volumeMounts:
  - mountPath: /app/config/bookmarks.yaml
    name: homepage-config
    subPath: bookmarks.yaml
  - mountPath: /app/config/kubernetes.yaml
    name: homepage-config
    subPath: kubernetes.yaml
  - mountPath: /app/config/services.yaml
    name: homepage-config
    subPath: services.yaml
  - mountPath: /app/config/widgets.yaml
    name: homepage-config
    subPath: widgets.yaml
  - mountPath: /app/config/proxmox.yaml
    name: homepage-config
    subPath: proxmox.yaml
  - mountPath: /app/config/settings.yaml
    name: homepage-config
    subPath: settings.yaml
  - mountPath: /app/config/custom.css
    name: homepage-config
    subPath: custom.css
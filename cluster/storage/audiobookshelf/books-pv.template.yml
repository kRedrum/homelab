apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-library-pv
  namespace: media
spec:
  capacity:
    storage: 50Ti
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - proto=tcp
    - nfsvers=4.2
  nfs:
    path: ${NFS_PATH}/books
    server: ${NFS_IP}
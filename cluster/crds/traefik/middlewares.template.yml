apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: infra
spec:
  ipAllowList:
    sourceRange:
      - "192.168.50.0/24"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-redirect
  namespace: infra
spec:
  redirectScheme:
    scheme: "https"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-middleware
  namespace: infra
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex"
      X-XSS-PROTECTION: "1"
    sslRedirect: true
    sslForceHost: true
    stsSeconds: 315360000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cs-bouncer
  namespace: infra
spec:
  plugin:
    cs-bouncer:
      enabled: true
      crowdsecMode: "live"
      crowdsecAppsecEnabled: true
      crowdsecAppsecHost: crowdsec-appsec-service.infra.svc.cluster.local:7422
      crowdsecLapiHost: crowdsec-service.infra.svc.cluster.local:8080
      crowdsecAppsecFailureBlock: true
      crowdsecAppsecUnreachableBlock: true
      crowdsecLapiKey: "${CROWDSEC_BOUNCER_KEY}"

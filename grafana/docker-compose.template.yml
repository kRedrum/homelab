  #   command: -config.file=/etc/loki/local-config.yml
  #   user: root
  #   networks:
  #     - network_private
  #   deploy:
  #     mode: replicated
  #     replicas: 1
  #     restart_policy:
  #       condition: on-failure
  #       delay: 10s
  #       max_attempts: 2
  #       window: 60s
  #     placement:
  #       constraints:
  #         - node.role == manager
  #   ports:
  #     - ${LOKI_PORT}:3100
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.swarm.network=network_private"
  #     - "traefik.http.routers.loki.rule=Host(`${GRAFANA_DOMAIN}`) && PathPrefix(`/loki`)"
  #     - "traefik.http.routers.loki.entrypoints=websecure"
  #     - "traefik.http.routers.loki.tls.certresolver=letsencrypt"
  #     - "traefik.http.services.loki.loadbalancer.server.port=3100"
  #     - "traefik.http.routers.loki.middlewares=loki-stripprefix,internal-only@file"
  #     - "traefik.http.middlewares.loki-stripprefix.stripprefix.prefixes=/loki"

  grafana:
    image: grafana/grafana-enterprise:latest
    volumes:
      - ${NAS_PATH}/data/grafana:/var/lib/grafana
      - ${NAS_PATH}/configs/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - network_private
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 2
        window: 60s
      placement:
        constraints:
          - node.role == manager
    ports:
      - ${GRAFANA_PORT}:3000
    labels:
      - "traefik.enable=true"
      - "traefik.swarm.network=network_private"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=internal-only@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  network_private:
    external: true

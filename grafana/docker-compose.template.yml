version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    user: root
    volumes:
      - ${NAS_PATH}/configs/grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${NAS_PATH}/data/prometheus:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - network_private
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 2
        window: 60s
      placement:
        constraints:
          - node.role == manager
    ports:
      - ${PROMETHEUS_PORT}:9090
    labels:
      - "traefik.enable=true"
      - "traefik.swarm.network=network_private"
      - "traefik.http.routers.prometheus.rule=Host(`${GRAFANA_DOMAIN}`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=prometheus-stripprefix,internal-only@file"
      - "traefik.http.middlewares.prometheus-stripprefix.stripprefix.prefixes=/prometheus"

  # loki:

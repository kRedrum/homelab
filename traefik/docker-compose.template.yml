version: "3.8"

services:
  traefik:
    image: "traefik:latest"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 2
        window: 60s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "prometheus-job=traefik"
        - "prometheus-port=8080"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NAS_PATH}/configs/traefik:/etc/traefik
      - ${NAS_PATH}/logs:/var/logs
      - ${NAS_PATH}/configs/certs:/srv/letsencrypt
    networks:
      - private
      - public

  whoami:
    image: traefik/whoami
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.traefik.middlewares=secure-middleware@file,rate-limit@file"
        - "traefik.http.routers.traefik.rule=Host(`${WHOAMI_DOMAIN}`)" 
        - "traefik.http.routers.traefik.entrypoints=websecure"
        - "traefik.http.services.traefik.loadbalancer.server.port=80"
        - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
    ports:
      - target: 80
        published: 8081
        protocol: tcp
        mode: host
    networks:
      - public

networks:
  private:
    driver: overlay
    attachable: true
  public:
    driver: overlay
    attachable: true
